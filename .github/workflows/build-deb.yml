name: Build and Release

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

jobs:
  build:
    name: Build (${{ matrix.arch }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64

          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner architecture
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Runner: ${{ matrix.runner }}"
          echo "Expected: ${{ matrix.arch }}"
          echo "uname -m: $(uname -m)"
          echo "dpkg: $(dpkg --print-architecture)"

          actual="$(dpkg --print-architecture)"

          if [[ "${actual}" != "${{ matrix.arch }}" ]]; then
            echo "Architecture mismatch!"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libcurl4-openssl-dev \
            libicu-dev \
            dpkg-dev

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Verify version
        shell: bash
        run: |
          set -Eeuo pipefail

          version="$(
            sed -nE \
              's/^project\(VelnixEditor VERSION ([^ )]+).*/\1/p' \
              CMakeLists.txt |
            head -n1
          )"

          if [[ -z "${version}" ]]; then
            echo "Unable to read version."
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" &&
                "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match project version ${version}"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velnix-editor-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.deb

  release:
    name: Create Release

    if: github.event_name == 'push' && github.ref_type == 'tag'

    needs: build

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: velnix-editor-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -Eeuo pipefail

          cd dist

          if ! compgen -G "*.deb" >/dev/null; then
            echo "No deb packages found."
            exit 1
          fi

          sha256sum *.deb > SHA256SUMS

      - name: Generate release notes
        shell: bash
        run: |
          set -Eeuo pipefail

          version="${GITHUB_REF_NAME#v}"

          awk -v version="${version}" '
            $1=="##" && $2=="["version"]" {
                found=1
                next
            }

            found && $1=="##" && $2~/^\[/ {
                exit
            }

            found {
                print
            }

            END{
                if(!found)
                    exit 1
            }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "Release notes are empty."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}

        shell: bash
        run: |
          set -Eeuo pipefail

          version="${GITHUB_REF_NAME#v}"

          release_files=(
            dist/*.deb
            dist/SHA256SUMS
            CHANGELOG.md
          )

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then

            gh release upload \
              "${GITHUB_REF_NAME}" \
              "${release_files[@]}" \
              --clobber

            gh release edit \
              "${GITHUB_REF_NAME}" \
              --title "Velnix Editor ${version}" \
              --notes-file release-notes.md

          else

            gh release create \
              "${GITHUB_REF_NAME}" \
              "${release_files[@]}" \
              --verify-tag \
              --title "Velnix Editor ${version}" \
              --notes-file release-notes.md

          fi
